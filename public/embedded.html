<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShopPulse - Weiterleitung...</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F6F6F7;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div id="loading" class="text-center p-6 bg-white rounded-lg shadow-sm max-w-md w-full">
    <svg class="w-12 h-12 mx-auto mb-4 text-blue-500 animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <h2 class="text-xl font-semibold mb-2">Weiterleitung zur Authentifizierung...</h2>
    <p class="text-gray-600">Einen Moment, du wirst zum Login weitergeleitet.</p>
  </div>
  
  <div id="error" class="hidden text-center p-6 bg-white rounded-lg shadow-sm max-w-md w-full">
    <svg class="w-12 h-12 mx-auto mb-4 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <h2 class="text-xl font-semibold mb-2">Fehler bei der Weiterleitung</h2>
    <p class="text-gray-600" id="error-message">Es fehlt der Shop-Parameter. Bitte installiere die App über den Shopify App Store.</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Parameter aus URL auslesen
      const params = new URLSearchParams(window.location.search);
      const shop = params.get('shop');
      const hmac = params.get('hmac');
      const host = params.get('host');
      
      console.log('Embedded.html geladen mit Parametern:', { shop, hmac: !!hmac, host: !!host });
      
      if (!shop) {
        // Fehler anzeigen - kein Shop-Parameter
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        return;
      }
      
      // Prüfen ob wir bereits authentifiziert sind (Cookie vorhanden)
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
      }
      
      const accessToken = getCookie('shopifyAccessToken');
      const shopFromCookie = getCookie('shopifyShop');
      
      // Wenn HMAC vorhanden ist, ist es ein Post-Installation-Zugriff
      if (hmac && accessToken && shopFromCookie === shop) {
        console.log('Post-Installation: Bereits authentifiziert, weiterleitung zum Dashboard');
        // Bereits authentifiziert, direkt zum Dashboard
        const dashboardUrl = `/dashboard?shop=${encodeURIComponent(shop)}&host=${encodeURIComponent(host || '')}&embedded=1`;
        window.location.href = dashboardUrl;
      } else {
        console.log('Neue Authentifizierung erforderlich');
        // Neue Authentifizierung erforderlich
        window.location.href = `/api/auth?shop=${encodeURIComponent(shop)}`;
      }
    });
  </script>
</body>
</html>
